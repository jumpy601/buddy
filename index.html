<!doctype html>
<html lang="zh-Hant">
<head><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>示範市政策島</title>
<meta charset="utf-8">
<style>
/* Layout: full-bleed clay-model city on canvas; floating paper panels pinned to the corners, HUD pill at the bottom. */
:root{
  --coral:#db6a41; --ink:#211d1d; --cream:#fff8f4; --yellow:#fcea8b; --stone:#c5b5a7; --green:#71806a;
  --teal:#3e7c8c; --paper:rgba(255,250,244,.84); --paper-solid:#fffaf5; --line:#eadbcc; --muted:#6f625a;
  --live:#3fae6a;
  --shadow:0 1px 2px #4a2a1410, 0 6px 16px #4a2a1414, 0 22px 48px #4a2a141c;
  --chip-shadow:0 2px 8px #4a2a1414;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --num:Georgia,"Times New Roman",serif;
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --card-top:118px;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(120% 90% at 50% 30%,#fffdf9 0%,#edddcf 100%);color:var(--ink);font-family:var(--font);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;outline:none}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
button{font-family:var(--font);color:var(--ink)}
.eyebrow{font:700 10px/1.2 var(--mono);letter-spacing:2px;text-transform:uppercase;color:var(--coral)}
.glass{background:var(--paper);backdrop-filter:blur(16px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15);border:1px solid rgba(255,255,255,.75);box-shadow:var(--shadow)}

/* buttons & chips */
.btn{min-height:44px;min-width:44px;border-radius:9px;border:0;background:transparent;font-weight:600;font-size:11.5px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 9px;cursor:pointer;line-height:1.1;transition:background .15s,color .15s}
.btn:hover{background:var(--yellow)}
.btn[aria-pressed="true"],.btn:active{background:var(--ink);color:#fff}
.btn:focus-visible,.chip:focus-visible,.pill:focus-visible,.pin:focus-visible,.row:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.btn svg{width:20px;height:20px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#fff;border:0;box-shadow:var(--chip-shadow);padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;min-height:34px}
.chip:hover{background:var(--yellow)}
.chip.cream{background:var(--cream)}

/* top-left brand + tools */
#topleft{position:fixed;left:calc(16px + var(--sl));top:calc(16px + var(--st));display:flex;gap:10px;align-items:flex-start;z-index:5}
#brand{border-radius:18px;padding:12px 18px 13px 16px}
#brand h1{margin:3px 0 0;font-size:24px;letter-spacing:1px;font-weight:800;line-height:1.15}
#brand h1 small{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:3px;margin-top:2px}
#tools{display:flex;gap:4px;border-radius:14px;padding:4px}
#tools .btn{font-size:11px}
#timeBtn{display:none}

/* left detail card */
#card{position:fixed;left:calc(16px + var(--sl));top:var(--card-top);width:340px;max-height:calc(100% - var(--card-top) - 110px - var(--sb));border-radius:22px;display:flex;flex-direction:column;z-index:4;background:var(--paper-solid);box-shadow:var(--shadow);overflow:hidden}
#card .scroll{overflow:auto;padding:18px 20px 20px;overscroll-behavior:contain}
#card .x{position:absolute;right:8px;top:8px;z-index:2;background:rgba(255,250,245,.9)}
.card-head{display:flex;gap:12px;align-items:center;margin-bottom:10px;padding-right:40px}
.card-head img{width:52px;height:52px;flex:none}
.card h2{margin:4px 0 0;font-size:21px;line-height:1.25;text-wrap:balance}
.card p{line-height:1.65;margin:8px 0;color:#3c3431}
.sec{margin-top:16px}
.sec>.eyebrow{display:block;margin-bottom:8px;color:var(--muted)}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.row{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:8px 8px;min-height:44px;cursor:pointer;font-size:13.5px}
.row:hover{background:var(--yellow)}
.row .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.row .t{flex:1;min-width:0}
.row .t small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.lit .n{background:#e5b928;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.thumb{display:block;width:160px;height:160px;margin:2px auto 6px;border-radius:18px;background:radial-gradient(circle at 50% 40%,#fff 0%,#f2e6da 100%)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--cream);border-radius:14px;padding:10px 10px 9px;box-shadow:inset 0 0 0 1px var(--line);min-width:0}
.tile b{display:block;font:italic 400 27px/1 var(--num);color:var(--coral);white-space:nowrap}
.tile b i{font:600 11px var(--font);color:var(--ink);margin-left:2px;font-style:normal}
.tile span{display:block;font-size:11.5px;line-height:1.45;color:#4a3f3a;margin-top:6px}
.timeline{display:grid;grid-template-columns:repeat(3,1fr);position:relative;margin-top:4px}
.timeline:before{content:"";position:absolute;left:16%;right:16%;top:9px;height:2px;background:var(--line)}
.timeline div{text-align:center;font-size:12px;color:var(--muted);position:relative}
.timeline div:before{content:"";display:block;width:14px;height:14px;margin:3px auto 6px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px var(--stone)}
.timeline .done:before{background:var(--stone);box-shadow:none}
.timeline .on{color:var(--ink);font-weight:700}
.timeline .on:before{background:var(--coral);box-shadow:0 0 0 4px #db6a4133}
.fromto{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.ev{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.ev svg{width:46px;height:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;align-items:center}
.kv dt{color:var(--muted)} .kv dd{margin:0;display:flex;align-items:center;gap:6px}
.kv img{width:26px;height:26px}
.note{background:var(--cream);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6}

/* right sidebar */
#side{position:fixed;right:calc(16px + var(--sr));top:calc(16px + var(--st));bottom:calc(98px + var(--sb));width:318px;border-radius:22px;display:flex;flex-direction:column;z-index:3;overflow:hidden}
#side header{padding:16px 16px 8px}
#side .search{width:100%;box-sizing:border-box;border:0;border-radius:10px;padding:11px 12px;font:14px var(--font);background:rgba(255,255,255,.85);box-shadow:inset 0 0 0 1px var(--line);min-height:44px}
.tabs{display:flex;gap:4px;margin-top:10px;background:rgba(255,255,255,.55);border-radius:11px;padding:3px}
.tabs .btn{flex:1;flex-direction:row;font-size:13px;min-height:38px}
#side .list{overflow:auto;padding:4px 10px 14px;flex:1;overscroll-behavior:contain}
details{border-radius:12px}
details+details{margin-top:2px}
summary{list-style:none;display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;cursor:pointer;min-height:44px;box-sizing:border-box;font-weight:700}
summary::-webkit-details-marker{display:none}
summary:hover{background:rgba(252,234,139,.7)}
summary .num{font:700 10px var(--mono);letter-spacing:1px;padding:4px 7px;border-radius:999px;background:var(--c);color:var(--fg,#fff)}
summary .cnt{margin-left:auto;font:600 11px var(--mono);color:var(--muted)}
summary:after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);margin:0 4px 0 2px;transition:transform .2s}
details[open] summary:after{transform:rotate(45deg)}
details .items{padding:0 0 6px 8px}
.empty{color:var(--muted);padding:14px 8px;font-size:13px}
.flowrow .t b{font-weight:700}

/* HUD */
#hud{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + var(--sb));display:flex;align-items:center;gap:4px;border-radius:999px;padding:6px 10px;z-index:5;white-space:nowrap}
#clock{display:flex;flex-direction:column;align-items:flex-start;padding:0 12px 0 10px;min-width:82px}
#clock b{font:italic 400 24px/1 var(--num);font-variant-numeric:tabular-nums}
#clock span{font-size:11px;color:var(--muted);margin-top:3px;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.sep{width:1px;align-self:stretch;margin:6px 4px;background:var(--line)}
#hud .btn{min-width:52px}

/* city log */
#log{position:fixed;top:calc(16px + var(--st));right:calc(16px + var(--sr));width:286px;max-height:min(42%,380px);border-radius:18px;display:flex;flex-direction:column;z-index:4;overflow:hidden}
body.side-open #log{right:calc(16px + 318px + 12px + var(--sr))}
#log header{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
#log header strong{font-size:14px}
.livedot{display:inline-flex;align-items:center;gap:5px;font:700 10px var(--mono);letter-spacing:1.5px;color:var(--live)}
.livedot:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 #3fae6a66;animation:pulse 1.6s infinite}
.paused .livedot{color:var(--muted)} .paused .livedot:before{background:var(--stone);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 7px #3fae6a00}100%{box-shadow:0 0 0 0 #3fae6a00}}
#logFilter{margin-left:auto;max-width:120px;border:0;border-radius:8px;background:rgba(255,255,255,.85);font:12px var(--font);padding:6px;min-height:32px;box-shadow:inset 0 0 0 1px var(--line)}
#logList{list-style:none;margin:0;padding:0 8px 10px;overflow:auto;font-size:12.5px}
#logList li{display:grid;grid-template-columns:42px 1fr;gap:8px;padding:6px;border-radius:8px;line-height:1.45}
#logList li time{font:600 11px var(--mono);color:var(--muted);padding-top:2px}
#logList li.new{animation:flash 1.2s}
@keyframes flash{from{background:var(--yellow)}to{background:transparent}}
#logList .tag{font:700 9px var(--mono);letter-spacing:1px;padding:1px 5px;border-radius:4px;margin-right:4px;background:var(--cream);color:var(--muted)}
#logList .tag.handoff{background:var(--yellow);color:var(--ink)}
#logList .tag.arrive{background:#d9ecdf;color:#2f6a45}

/* legend */
#legend{position:fixed;left:calc(16px + var(--sl));bottom:calc(16px + var(--sb));border-radius:14px;padding:10px 14px;z-index:3;font-size:12px;display:flex;flex-direction:column;gap:5px}
#legend div{display:flex;align-items:center;gap:8px}
#legend svg{width:40px;height:8px}
body.card-open #legend{display:none}

/* labels */
.pill{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:6px;padding:4px 11px 4px 5px;border-radius:999px;background:var(--paper-solid);box-shadow:var(--chip-shadow);font-size:13px;font-weight:700;white-space:nowrap;border:0;transition:opacity .25s,background .2s,color .2s;user-select:none}
.pill b{font:700 10px var(--mono);letter-spacing:1px;background:var(--c);color:var(--fg,#fff);border-radius:999px;padding:4px 6px}
.pill.sel{background:var(--ink);color:#fff}
.pill.dim{opacity:.42}
.pill.compact{padding:4px 5px}
.pill.compact span{display:none}
.pin{pointer-events:auto;cursor:pointer;width:24px;height:24px;border-radius:50%;background:var(--coral);color:#fff;border:2px solid #fff;font:700 12px var(--font);display:grid;place-items:center;box-shadow:var(--chip-shadow);padding:0}
.pin.on{background:var(--ink)}
.pin.lit{background:#e5b928;color:var(--ink)}
.bubble{background:#fff;border-radius:10px;padding:4px 8px;font-size:11.5px;font-weight:600;white-space:nowrap;box-shadow:var(--chip-shadow);position:relative}
.bubble:after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;background:#fff;transform:translateX(-50%) rotate(45deg)}

/* loader & help */
#loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 30%,#fffdf9 0%,#edddcf 100%);transition:opacity .6s}
#loader.done{opacity:0;pointer-events:none}
#loader .box{text-align:center;padding:24px;max-width:520px}
#loader h1{font-size:clamp(34px,7vw,60px);margin:8px 0;letter-spacing:4px;font-weight:800}
#loader p{color:var(--muted);font-size:15px}
.dots{display:flex;gap:8px;justify-content:center;margin-top:18px}
.dots i{width:12px;height:12px;border-radius:3px;background:var(--coral);animation:bob 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s;background:var(--yellow)} .dots i:nth-child(3){animation-delay:.3s;background:var(--teal)}
@keyframes bob{50%{transform:translateY(-8px) rotate(30deg)}}
#loadErr{margin-top:18px;background:#fff;border-radius:14px;padding:14px 16px;text-align:left;box-shadow:var(--shadow);line-height:1.6;font-size:13.5px}
#loadErr code{font:12px var(--mono);word-break:break-all;color:var(--coral)}
#help{position:fixed;inset:0;z-index:15;display:grid;place-items:center;background:rgba(48,32,24,.28);padding:16px}
#help .dlg{background:var(--paper-solid);border-radius:22px;box-shadow:var(--shadow);max-width:560px;width:100%;padding:24px 24px 20px;box-sizing:border-box}
#help h2{margin:6px 0 14px;font-size:22px}
#help ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
#help li{background:var(--cream);border-radius:16px;padding:14px;font-size:13px;line-height:1.6}
#help li b{display:block;font:italic 400 30px/1 var(--num);color:var(--coral);margin-bottom:6px}
#help li strong{display:block;font-size:14px;margin-bottom:4px}
#help .go{margin-top:16px;display:flex;justify-content:flex-end}
#help .go .btn{flex-direction:row;background:var(--ink);color:#fff;padding:0 22px;font-size:14px}
#help .go .btn:hover{background:var(--coral)}

.handle{display:none}

/* phone */
@media (max-width:800px){
  #topleft{flex-direction:column;gap:8px;left:calc(10px + var(--sl));top:calc(10px + var(--st))}
  #brand{padding:9px 13px 10px 12px;border-radius:15px}
  #brand h1{font-size:18px}
  #brand h1 small{font-size:10px;letter-spacing:2px}
  #tools{flex-direction:column}
  #timeBtn{display:inline-flex}
  #hud{display:none;left:10px;right:10px;transform:none;bottom:calc(10px + var(--sb));border-radius:22px;flex-wrap:wrap;justify-content:center;white-space:normal;padding:8px}
  body.hud-open #hud{display:flex}
  #hud .sep{display:none}
  #clock{width:100%;flex-direction:row;align-items:baseline;gap:10px;padding:2px 8px 6px}
  #side,#card{left:0;right:0;top:auto;bottom:0;width:auto;max-height:none;border-radius:22px 22px 0 0;height:var(--h);transition:height .25s}
  #side{--h:52%} #card{--h:34%}
  #side.dragging,#card.dragging{transition:none}
  .handle{display:block;width:100%;height:24px;flex:none;cursor:grab;touch-action:none;position:relative;border:0;background:transparent}
  .handle:after{content:"";position:absolute;left:50%;top:9px;width:44px;height:5px;border-radius:3px;background:var(--stone);transform:translateX(-50%)}
  #card .scroll{padding-top:4px;padding-bottom:calc(20px + var(--sb))}
  #log{width:min(230px,calc(100% - 140px));right:calc(10px + var(--sr));top:calc(10px + var(--st));max-height:30%}
  body.side-open #log{right:calc(10px + var(--sr))}
  #legend{bottom:calc(10px + var(--sb));left:auto;right:calc(10px + var(--sr))}
  body.side-open #legend{display:none}
  #help ol{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

<div id="stage" aria-label="3D 城市" data-en-label="3D city"></div>

<div id="topleft">
  <div id="brand" class="glass">
    <div class="eyebrow" data-en="Policy islands · demo">政策城市模型 · 示範</div>
    <h1><span id="cityName">示範市</span><small data-en="POLICY ISLANDS">政策島</small></h1>
  </div>
  <div id="tools" class="glass" role="toolbar" aria-label="工具列" data-en-label="Tools">
    <button class="btn" id="btnHome" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><circle cx="12" cy="12" r="3"/></svg><span data-en="Overview">全景</span></button>
    <button class="btn" id="btnList" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg><span data-en="List">清單</span></button>
    <button class="btn" id="timeBtn" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg><span data-en="Time">時間</span></button>
    <button class="btn" id="btnHelp" type="button" aria-label="操作說明" data-en-label="How to use"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.6"/><circle cx="12" cy="16.9" r=".6" fill="currentColor"/></svg><span>?</span></button>
  </div>
</div>

<aside id="card" class="card" hidden aria-live="polite">
  <button class="handle" type="button" aria-label="拖曳調整高度" data-en-label="Drag to resize"></button>
  <button class="btn x" id="cardClose" type="button" aria-label="關閉卡片" data-en-label="Close card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="scroll" id="cardBody"></div>
</aside>

<aside id="side" class="glass" hidden>
  <button class="handle" type="button" aria-label="拖曳調整高度" data-en-label="Drag to resize"></button>
  <header>
    <input id="search" class="search" type="search" placeholder="搜尋政策、主題…" data-en-placeholder="Search policies, topics…" autocomplete="off" aria-label="搜尋" data-en-label="Search">
    <div class="tabs" role="tablist">
      <button class="btn" id="tabTopics" role="tab" type="button" aria-pressed="true" data-en="Policy topics">政策主題</button>
      <button class="btn" id="tabFlows" role="tab" type="button" aria-pressed="false" data-en="Collaborations">協作關係</button>
    </div>
  </header>
  <div class="list" id="sideList"></div>
</aside>

<section id="log" class="glass" hidden aria-label="城市日誌" data-en-label="City log">
  <header><strong data-en="City log">城市日誌</strong><span class="livedot">LIVE</span>
    <select id="logFilter" aria-label="依協作線篩選" data-en-label="Filter by collaboration"></select></header>
  <ol id="logList" aria-live="off"></ol>
</section>

<div id="legend" class="glass" hidden>
  <div class="eyebrow" data-en="Evidence level">協作線 · 證據等級</div>
  <div><svg viewBox="0 0 40 8"><line x1="2" y1="4" x2="38" y2="4" stroke="#db6a41" stroke-width="3" stroke-linecap="round"/></svg><span data-en="Official document">正式文件</span></div>
  <div><svg viewBox="0 0 40 8"><line x1="2" y1="4" x2="38" y2="4" stroke="#db6a41" stroke-width="3" stroke-dasharray="7 5"/></svg><span data-en="Thematic match">主題對應</span></div>
  <div><svg viewBox="0 0 40 8"><line x1="3" y1="4" x2="38" y2="4" stroke="#db6a41" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 6"/></svg><span data-en="Pending evidence">待確認</span></div>
</div>

<nav id="hud" class="glass" aria-label="時間與顯示" data-en-label="Time and layers">

function buildFlows() {

      return out.lerpVectors(this.pts[i], this.pts[i + 1], clamp((s - this.cum[i]) / seg, 0, 1));
    }
  }
  const modes = { official: 0, thematic: 1, pending: 2 };
  for (const f of DATA.flows) {
    const curve = new PolyCurve(f.pts.map((p) => p.clone().add(new THREE.Vector3(0, .07, 0))));

    const mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, toneMapped: false,
      uniforms: { uTime: { value: 0 }, uLen: { value: curve.len }, uMode: { value: modes[f.level] ?? 0 }, uColor: { value: new THREE.Color(C.coral) }, uOpacity: { value: .82 } },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,

}

function closeCard() { $('#card').hidden = true; document.body.classList.remove('card-open'); uiRectsDirty = true; S.dirty = true; }
function wireDelegates(root) {
  root.addEventListener('click', (e) => {
    const t = e.target.closest('[data-item],[data-isl],[data-flow]'); if (!t) return;
    if (t.dataset.item) selectItem(t.dataset.item); else if (t.dataset.isl) selectIsland(t.dataset.isl); else selectFlow(t.dataset.flow);
  });
}

// 160² off-screen thumbnail of a single model, rendered with the main renderer
const _thumbs = {}; let thumbScene, thumbCam;
function thumbURL(it) {
  if (_thumbs[it.id]) return _thumbs[it.id];
  try {
    if (!thumbScene) {
      thumbScene = new THREE.Scene();
      thumbScene.add(new THREE.HemisphereLight(0xeef6fa, 0x8f8270, 1.5));
      const d = new THREE.DirectionalLight(0xfff1de, 2.4); d.position.set(2, 4, 3); thumbScene.add(d);
      thumbCam = new THREE.PerspectiveCamera(30, 1, .1, 50); thumbCam.position.set(1.85, 1.75, 2.75); thumbCam.lookAt(0, .55, 0);
    }
    const k = new Kit('thumb'), r = mulberry32(DATA.seed + 1);
    const b = builder(k, frame3(0, 0, 0, -.35, 1), null, r);
    (MODELS[it.model] || MODELS.house)(b, it.island.color);
    k.build(thumbScene, { cast: false });
    const px = 160, pr = renderer.getPixelRatio(), su = renderer.shadowMap.needsUpdate;
    renderer.shadowMap.needsUpdate = false;
    renderer.setScissorTest(true); renderer.setViewport(0, 0, px, px); renderer.setScissor(0, 0, px, px);
    renderer.setClearColor(0x000000, 0); renderer.clear();
    renderer.render(thumbScene, thumbCam);
    const c = document.createElement('canvas'); c.width = c.height = Math.round(px * pr);
    const src = renderer.domElement;
    c.getContext('2d').drawImage(src, 0, src.height - c.height, c.width, c.height, 0, 0, c.width, c.height);
    renderer.setScissorTest(false); renderer.setViewport(0, 0, innerWidth, innerHeight);
    renderer.shadowMap.needsUpdate = su;
    k.meshes.forEach((m) => { thumbScene.remove(m); m.dispose(); });
    _thumbs[it.id] = c.toDataURL('image/png');
    renderNow();
  } catch (e) { console.warn(e); _thumbs[it.id] = iconURL('star'); }
  return _thumbs[it.id];
}

// ============================================================================
// Sidebar, HUD, log, help, sheets, keyboard, picking
// ============================================================================
let sideTab = 'topics';
function renderSide() {
  const q = $('#search').value.trim().toLowerCase();
  const list = $('#sideList');
  const match = (...xs) => !q || xs.some((x) => String(T(x)).toLowerCase().includes(q));
  if (sideTab === 'topics') {
    const html = DATA.islands.map((isl) => {
      const items = isl.items.filter((it) => match(it.name, it.desc) || match(isl.name));
      if (q && !items.length) return '';
      return `<details ${q ? 'open' : ''} data-island="${isl.id}"><summary style="--c:${isl.color};--fg:${textOn(isl.color)}"><span class="num">${isl.no}</span>${esc(T(isl.name))}<span class="cnt">${isl.items.length}</span></summary>
        <ol class="items">${items.map((it) => `<li><button class="row" type="button" data-item="${it.id}"><span class="n">${circled(it.n)}</span><span class="t">${esc(T(it.name))}</span></button></li>`).join('')}</ol></details>`;
    }).join('');
    list.innerHTML = html || `<p class="empty">${tr('找不到符合的政策，換個關鍵字試試。', 'No matching policies. Try another keyword.')}</p>`;
    list.querySelectorAll('summary').forEach((s) => s.addEventListener('click', () => { const id = s.parentElement.dataset.island; if (!s.parentElement.open) selectIsland(id); }));
  } else {
    const rows = DATA.flows.filter((f) => match(f.label, f.note, ISL[f.from].name, ISL[f.to].name)).map((f) => `<li><button class="row flowrow" type="button" data-flow="${f.id}"><img src="${iconURL(f.cargo)}" width="24" height="24" alt=""><span class="t"><b>${esc(T(f.label))}</b><small>${ISL[f.from].no} ${esc(T(ISL[f.from].name))} → ${ISL[f.to].no} ${esc(T(ISL[f.to].name))} · ${esc(T(DATA.levels[f.level].name))}</small></span></button></li>`).join('');
    list.innerHTML = rows ? `<ol class="items">${rows}</ol>` : `<p class="empty">${tr('沒有符合的協作關係。', 'No matching collaborations.')}</p>`;
  }
  refreshTints();
}
function toggleSide(on) {
  S.showSide = on; $('#side').hidden = !on; $('#btnList').setAttribute('aria-pressed', String(on));
  document.body.classList.toggle('side-open', on);
  if (on && S.mobile) { closeCard(); $('#side').style.setProperty('--h', '52%'); }
  uiRectsDirty = true; S.dirty = true;
}
function toggleLog(on) { S.showLog = on; $('#log').hidden = !on; $('#tgLog').setAttribute('aria-pressed', String(on)); uiRectsDirty = true; S.dirty = true; }
const LOG = []; let logFilter = 'all';
function pushLog(e) {
  LOG.unshift(e); if (LOG.length > 80) LOG.pop();
  if (logFilter !== 'all' && e.flow !== logFilter) return;
  const ul = $('#logList'); const li = logItem(e); li.classList.add('new'); ul.prepend(li);
  while (ul.children.length > 50) ul.lastChild.remove();
}
function logItem(e) {
  const li = document.createElement('li');
  const tags = { depart: tr('出發', 'DEPART'), arrive: tr('抵達', 'ARRIVE'), handoff: tr('交接', 'HANDOFF') };
  li.innerHTML = `<time>${hmm(e.t)}</time><span><span class="tag ${e.type}">${tags[e.type]}</span>${esc(e.text)}</span>`;
  return li;
}
function renderLog() { const ul = $('#logList'); ul.innerHTML = ''; LOG.filter((e) => logFilter === 'all' || e.flow === logFilter).slice(0, 50).forEach((e) => ul.append(logItem(e))); }
function openHelp() { $('#help').hidden = false; setTimeout(() => $('#helpOk').focus(), 50); }
function closeHelp() { $('#help').hidden = true; store.set('policyIsland.help.v1', '1'); }
function sheet(el, def, onClose) {
  const h = el.querySelector('.handle'); let y0 = null, h0 = 0;
  h.addEventListener('pointerdown', (e) => { if (!S.mobile) return; h.setPointerCapture(e.pointerId); y0 = e.clientY; h0 = el.getBoundingClientRect().height; el.classList.add('dragging'); });
  h.addEventListener('pointermove', (e) => { if (y0 == null) return; el.style.setProperty('--h', clamp(h0 + (y0 - e.clientY), 60, innerHeight) + 'px'); });
  const end = () => {
    if (y0 == null) return; y0 = null; el.classList.remove('dragging');
    const f = el.getBoundingClientRect().height / innerHeight;
    if (f < .18) onClose(); else el.style.setProperty('--h', f > .7 ? '100%' : def);
    uiRectsDirty = true; S.dirty = true;
  };
  h.addEventListener('pointerup', end); h.addEventListener('pointercancel', end);
  h.addEventListener('click', () => { if (!S.mobile) return; const f = el.getBoundingClientRect().height / innerHeight; el.style.setProperty('--h', f > .7 ? def : '100%'); uiRectsDirty = true; });
}
function orbitBy(dAz, dPol) {
  S.fly = null;
  const off = camera.position.clone().sub(controls.target), sph = new THREE.Spherical().setFromVector3(off);
  sph.theta += dAz; sph.phi = clamp(sph.phi + dPol, controls.minPolarAngle, controls.maxPolarAngle);
  off.setFromSpherical(sph); camera.position.copy(controls.target).add(off); controls.update(); S.dirty = true;
}
function updateClockUI() {
  $('#clockTime').textContent = hmm(S.minute);
  const s = slotAt(S.minute);
  if (s !== S.slot) { S.slot = s; $('#clockSlot').textContent = s >= 0 ? T(DATA.dayCycle[s].name) : ''; refreshTints(); }
}
function onMotionPref() {
  if (S.rm) S.fly = null;
  document.body.classList.toggle('paused', S.paused || S.rm);
  $('#log').classList.toggle('paused', S.paused || S.rm);
  S.dirty = true;
}
function placeCard() {
  if (S.mobile) return;
  const r = $('#topleft').getBoundingClientRect();
  document.documentElement.style.setProperty('--card-top', Math.round(r.bottom + 12) + 'px');
}
function buildUI() {
  const pressed = (el, v) => el.setAttribute('aria-pressed', String(v));
  $('#btnHome').addEventListener('click', () => goHome());
  $('#btnList').addEventListener('click', () => toggleSide(!S.showSide));
  $('#btnHelp').addEventListener('click', openHelp);
  $('#helpOk').addEventListener('click', closeHelp);
  $('#help').addEventListener('click', (e) => { if (e.target.id === 'help') closeHelp(); });
  $('#cardClose').addEventListener('click', deselect);
  $('#timeBtn').addEventListener('click', () => { S.hudOpen = !S.hudOpen; document.body.classList.toggle('hud-open', S.hudOpen); pressed($('#timeBtn'), S.hudOpen); uiRectsDirty = true; });
  document.querySelectorAll('.tbtn').forEach((b) => b.addEventListener('click', () => { S.minute = +b.dataset.min; applyTime(S.minute, true); updateClockUI(); }));
  $('#tgTags').addEventListener('click', (e) => { S.showTags = !S.showTags; pressed(e.currentTarget, S.showTags); S.dirty = true; });
  $('#tgCarry').addEventListener('click', (e) => { S.showCarry = !S.showCarry; pressed(e.currentTarget, S.showCarry); updateWalkers(0); S.dirty = true; });
  $('#tgFlows').addEventListener('click', (e) => { S.showFlows = !S.showFlows; pressed(e.currentTarget, S.showFlows); updateFlowVis(); });
  $('#tgPause').addEventListener('click', (e) => { S.paused = !S.paused; pressed(e.currentTarget, S.paused); onMotionPref(); });
  $('#tgBird').addEventListener('click', () => setBird(!S.bird));
  $('#tgLog').addEventListener('click', () => toggleLog(!S.showLog));
  $('#search').addEventListener('input', renderSide);
  $('#tabTopics').addEventListener('click', () => { sideTab = 'topics'; pressed($('#tabTopics'), true); pressed($('#tabFlows'), false); renderSide(); });
  $('#tabFlows').addEventListener('click', () => { sideTab = 'flows'; pressed($('#tabFlows'), true); pressed($('#tabTopics'), false); renderSide(); });
  const sel = $('#logFilter');
  sel.innerHTML = `<option value="all">${tr('全部協作線', 'All links')}</option>` + DATA.flows.map((f) => `<option value="${f.id}">${esc(T(f.label))}</option>`).join('');
  sel.addEventListener('change', () => { logFilter = sel.value; renderLog(); });
  wireDelegates($('#cardBody')); wireDelegates($('#sideList'));
  sheet($('#card'), '34%', deselect); sheet($('#side'), '52%', () => toggleSide(false));
  renderSide();
  toggleSide(!S.mobile && innerWidth > 1100);
  toggleLog(!S.mobile);
  updateClockUI();
  placeCard();
  addEventListener('resize', () => { S.mobile = matchMedia('(max-width: 800px)').matches; placeCard(); uiRectsDirty = true; });
  addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input,select,textarea')) return;
    if (e.key === 'Escape') { if (!$('#help').hidden) closeHelp(); else if (S.sel) deselect(); return; }
    const step = .12;
    if (e.key === 'ArrowLeft') { orbitBy(-step, 0); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { orbitBy(step, 0); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { orbitBy(0, -step * .6); e.preventDefault(); }
    else if (e.key === 'ArrowDown') { orbitBy(0, step * .6); e.preventDefault(); }
  });
  // picking: pointerup within 6px of pointerdown
  const cv = renderer.domElement, ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  let down = null;
  cv.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; S.fly = null; });
  cv.addEventListener('wheel', () => { S.fly = null; }, { passive: true });
  cv.addEventListener('pointerup', (e) => {
    if (!down) return; const moved = Math.hypot(e.clientX - down[0], e.clientY - down[1]); down = null;
    if (moved > 6) return;
    ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const objs = [...islandTops, ...kitMain.meshes, ...kitSmall.meshes.filter((m) => m.visible), ...(S.showCarry ? walkerMeshes : []), ...flowMeshes.filter((m) => m.visible)];
    for (const h of ray.intersectObjects(objs, false)) {
      const o = h.object;
      if (o.userData.flow) return selectFlow(o.userData.flow.id);
      if (o.userData.walkerKind) { const w = o.userData.owners[h.instanceId]; if (w) return selectWalker(w.index); continue; }
      if (o.userData.entries) { const en = o.userData.entries[h.instanceId]; if (!en || !en.owner) continue; if (en.owner.item) return selectItem(en.owner.item.id); return selectIsland(en.owner.island.id); }
      if (o.userData.islandTop) return selectIsland(nearestIsland(h.point.x, h.point.z).id);
    }
  });
}

// ============================================================================
// Frame loop: render only when something changed or animates
// ============================================================================
let last = performance.now(), lastClockMin = -1;
function renderNow() { renderer.render(scene, camera); layoutLabels(); labelRenderer.render(scene, camera); }
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, .08); last = now;
  let anim = false;
  if (!S.rm) {
    if (!S.paused) {
      S.minute = (S.minute + dt * 10) % 1440;
      applyTime(S.minute);
      if (Math.floor(S.minute) !== lastClockMin) { lastClockMin = Math.floor(S.minute); updateClockUI(); }
    }
    S.time += dt;
    waterU.uTime.value = S.time;
    for (const f of DATA.flows) if (f.mesh.visible) f.mesh.material.uniforms.uTime.value = S.time;
    updateClouds(dt);
    updateWalkers(dt);
    anim = true;
  }
  if (S.fly) {
    const t = clamp((now - S.fly.t0) / S.fly.dur, 0, 1), e = easeInOutCubic(t);
    camera.position.lerpVectors(S.fly.p0, S.fly.p1, e); controls.target.lerpVectors(S.fly.q0, S.fly.q1, e);
    if (t >= 1) S.fly = null;
    anim = true;
  }
  if (controls.update()) S.dirty = true;
  if (!anim && !S.dirty) return;
  // LOD: hide small props when far away
  const far = controls.getDistance() >= 26;
  if (far === S.smallVisible) { S.smallVisible = !far; kitSmall.meshes.forEach((m) => { m.visible = !far; }); renderer.shadowMap.needsUpdate = true; }
  if (S.rm || !S.showCarry) updateWalkers(0);
  renderNow();
  S.dirty = false;
}

// ============================================================================
// Boot (kept last: top-level await must not run before the declarations above)
// ============================================================================
applyLang();
$('#cityName').textContent = T(DATA.city);
$('#loaderTitle').textContent = T(DATA.city) + tr('政策島', ' Policy Islands');
document.title = T(DATA.city) + tr('政策島', ' Policy Islands');
const slowTimer = setTimeout(() => { if (!$('#loader').classList.contains('done')) $('#loaderMsg').textContent = tr('還在下載 3D 元件，網路可能有點慢…', 'Still downloading 3D components, the network may be slow…'); }, 12000);
try {
  if (!webglOK()) throw new Error(tr('這個瀏覽器無法建立 WebGL。', 'This browser cannot create a WebGL context.'));
  const m = await Promise.all([
    import('three'),
    import('three/addons/controls/OrbitControls.js'),
    import('three/addons/renderers/CSS2DRenderer.js'),
    import('three/addons/geometries/RoundedBoxGeometry.js'),
    import('three/addons/utils/BufferGeometryUtils.js'),
    import('three/addons/math/SimplexNoise.js')
  ]);
  THREE = m[0]; OrbitControls = m[1].OrbitControls; CSS2DRenderer = m[2].CSS2DRenderer; CSS2DObject = m[2].CSS2DObject;
  RoundedBoxGeometry = m[3].RoundedBoxGeometry; BGU = m[4]; SimplexNoise = m[5].SimplexNoise;
  init();
  clearTimeout(slowTimer);
} catch (err) {
  clearTimeout(slowTimer);
  showError(err);
}

</script>
